<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-2:#fafbfc; --ink:#1f2430; --ink-soft:#5b6472;
    --line:#e3e6eb; --line-strong:#cdd2da; --accent:#c8622d; --accent-soft:#f6e9e1;
    --accent-ink:#a44e21; --ok:#16a34a; --warn:#d97706; --danger:#dc2626;
    --chip:#eef1f5; --shadow:0 1px 2px rgba(20,26,38,.06),0 6px 18px rgba(20,26,38,.06);
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12151b; --panel:#1b1f27; --panel-2:#20242d; --ink:#e8eaee; --ink-soft:#9aa3b1;
      --line:#2c313b; --line-strong:#3a414d; --accent:#e0894f; --accent-soft:#33261d;
      --accent-ink:#f0a976; --chip:#262b34; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    --bg:#12151b; --panel:#1b1f27; --panel-2:#20242d; --ink:#e8eaee; --ink-soft:#9aa3b1;
    --line:#2c313b; --line-strong:#3a414d; --accent:#e0894f; --accent-soft:#33261d;
    --accent-ink:#f0a976; --chip:#262b34; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.28);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent-ink)}
  h1,h2,h3{margin:0; font-weight:700}
  button{font-family:inherit}

  .appbar{position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line); box-shadow:var(--shadow)}
  .appbar-in{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:10px; margin-right:auto}
  .brand .mk{width:30px;height:30px;border-radius:9px;object-fit:cover;display:block;border:1px solid var(--line)}
  .brand b{font-size:16px; letter-spacing:.02em}
  .brand span{display:block; font-size:11px; color:var(--ink-soft); font-weight:500; letter-spacing:.04em}
  .mode{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink-soft); white-space:nowrap}
  .mode.cloud{color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, var(--line))}
  .badges{display:flex; gap:8px; flex-wrap:wrap}
  .badge{font-size:11px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--chip); color:var(--ink-soft)}
  .badge b{color:var(--ink)}
  .badge.alert{background:color-mix(in srgb, var(--danger) 14%, transparent); color:var(--danger)}

  .tabs{max-width:1180px; margin:0 auto; padding:10px 16px 0; display:flex; gap:6px; flex-wrap:wrap}
  .tabs button{position:relative; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:700; cursor:pointer}
  .tabs button[aria-selected="true"]{background:#F39800; border-color:#F39800; color:#fff}
  .tab-badge{position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:var(--danger); color:#fff; font-size:10px; line-height:17px; text-align:center; font-weight:700; box-shadow:0 0 0 2px var(--panel)}

  main{max-width:1180px; margin:0 auto; padding:16px}
  .banner{margin:12px auto 0; max-width:1180px; padding:10px 14px; border-radius:12px; font-size:13px;
    display:flex; align-items:flex-start; gap:12px;
    background:var(--accent-soft); color:var(--accent-ink); border:1px solid color-mix(in srgb,var(--accent) 30%, var(--line))}
  .banner .banner-msg{flex:1}
  .banner .banner-x{flex:none; background:transparent; border:0; color:inherit; font-size:18px; line-height:1; cursor:pointer; padding:0 2px; opacity:.55}
  .banner .banner-x:hover{opacity:1}
  .banner.err{background:color-mix(in srgb,var(--danger) 12%,transparent); color:var(--danger); border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .banner.hide{display:none}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; margin-bottom:16px}
  .panel h2{font-size:15px; margin-bottom:4px}
  .panel .sub{color:var(--ink-soft); font-size:12px; margin-bottom:12px}

  .row{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end}
  .fld{display:flex; flex-direction:column; gap:4px; min-width:150px}
  .fld label{font-size:11px; font-weight:700; color:var(--ink-soft)}
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink); background:var(--panel-2); border:1px solid var(--line-strong); border-radius:10px; padding:8px 10px}
  input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent); outline-offset:1px}
  textarea{resize:vertical; min-height:60px}
  input[type=color]{padding:2px; width:44px; height:34px}
  input[type=checkbox]{width:16px;height:16px}

  .btn{border:1px solid var(--line-strong); background:var(--panel-2); color:var(--ink); font-weight:700; font-size:13px; padding:8px 14px; border-radius:10px; cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
  .btn.sm{padding:5px 9px; font-size:12px; border-radius:8px}
  .btn.danger{color:var(--danger); border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
  .btn:disabled{opacity:.5; cursor:not-allowed}

  .save-state{font-size:12px; font-weight:700; color:var(--ink-soft)}
  .save-state.dirty{color:var(--warn)}
  .save-state.saved{color:var(--ok)}

  .cat-h{margin:18px 0 8px; font-size:13px; font-weight:700; color:var(--accent-ink); border-left:3px solid var(--accent); padding-left:8px}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
  .card{position:relative; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:6px}
  .card .bdot{position:absolute; top:8px; left:8px; width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.25); box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .card .newbadge{position:absolute; top:6px; right:6px; background:var(--danger); color:#fff; font-size:9px; font-weight:700; letter-spacing:.06em; padding:2px 5px; border-radius:4px; box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .notice-box{border-color:color-mix(in srgb,#F39800 45%,var(--line)); background:var(--accent-soft)}
  .notice-h{font-size:13px; font-weight:700; color:var(--accent-ink); margin-bottom:6px}
  .notice-item{font-size:13px; padding:5px 0; border-top:1px dashed color-mix(in srgb,#F39800 35%,var(--line))}
  .notice-item:first-of-type{border-top:0}
  .notice-date{display:inline-block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-right:8px}
  .thumb{width:100%; aspect-ratio:3/4; border-radius:8px; background:var(--chip); object-fit:contain; display:block}
  .thumb.ph{display:grid; place-items:center; color:var(--ink-soft); font-size:11px; text-align:center; padding:6px}
  .card .nm{font-size:12px; font-weight:700; line-height:1.35; min-height:2.7em}
  .card select{width:100%; text-align:center; font-weight:700; color:var(--ink-soft)}
  .card select.qset{color:#d80026}
  .card.has-qty{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft) inset}
  .conv{font-size:11px; color:var(--ink-soft); text-align:center; min-height:1.2em}
  .utag{display:inline-block; font-size:10px; font-weight:700; padding:1px 6px; border-radius:999px; background:var(--chip); color:var(--ink-soft); margin-left:6px}

  .tbl-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:12px}
  table{border-collapse:collapse; width:100%; font-size:13px; min-width:640px}
  th,td{padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle}
  th{background:var(--panel-2); font-size:11px; color:var(--ink-soft); position:sticky; top:0}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  tfoot td{border-top:2px solid var(--line-strong); font-weight:700}
  .mini{width:34px; aspect-ratio:3/4; border-radius:4px; object-fit:contain; background:var(--chip); display:inline-block; vertical-align:middle; margin-right:8px}
  .name-cell{display:flex; align-items:center; gap:2px; min-width:190px}

  .pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; color:#fff}
  .tag-ok{background:var(--chip); color:var(--ink-soft)}
  .short{width:74px}
  .muted{color:var(--ink-soft); font-size:12px}
  .rowline{display:flex; gap:8px; align-items:center; padding:8px 0; border-bottom:1px dashed var(--line); flex-wrap:wrap}
  .rowline:last-child{border-bottom:0}
  .grow{flex:1 1 160px}
  .hist-note{font-size:12px; color:var(--ink-soft)}

  /* catalog */
  .cgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px}
  .ccard{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:8px; position:relative}
  .ccard .cdot{position:absolute; top:9px; left:9px; width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.25); box-shadow:0 0 0 2px rgba(255,255,255,.9)}
  .ccard .cimg{width:100%; aspect-ratio:3/4; object-fit:contain; border-radius:8px; background:var(--chip)}
  .ccard .cimg.ph{display:grid; place-items:center; color:var(--ink-soft); font-size:11px}
  .ccard .ctitle{font-size:13px; font-weight:700; line-height:1.35}
  .ccard .cact{display:flex; gap:8px; margin-top:auto}
  .swatch{width:30px; height:30px; border-radius:8px; border:2px solid var(--line-strong); cursor:pointer; padding:0}
  .swatch.on{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent); outline-offset:1px; border-color:var(--ink)}
  .dotbtn{width:30px;height:30px;border-radius:999px;border:2px solid var(--line-strong);cursor:pointer;padding:0}
  .dotbtn.on{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent); outline-offset:1px}

  /* 提出済みタブ */
  .sub-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--panel-2)}
  .sub-row.muted-row{opacity:.5}
  .sub-row.sub-new{border-color:var(--danger); box-shadow:0 0 0 2px color-mix(in srgb,var(--danger) 12%,transparent) inset}
  tr.po-new td{background:color-mix(in srgb,var(--danger) 8%,transparent)}
  .sub-row .s-name{font-weight:700; min-width:84px}
  .sub-detail{margin:-4px 0 12px; padding:10px 12px; border:1px dashed var(--line-strong); border-radius:10px}

  @media (max-width:560px){
    .fld{min-width:120px; flex:1 1 44%}
    .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
    .cgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  }

  /* 印刷（提出データを店舗ごとに A4 1枚で出力） */
  #printArea{display:none}
  @media print{
    @page{ size:A4 landscape; margin:6mm }
    html,body{ background:#fff }
    body > *:not(#printArea){ display:none !important }
    #printArea{ display:block !important; color:#000;
      -webkit-print-color-adjust:exact; print-color-adjust:exact }
    .psheet{ page-break-after:always; overflow:hidden }
    .psheet:last-child{ page-break-after:auto }
    .phead{ display:flex; justify-content:space-between; gap:8px; border:1.5px solid #000; padding:3px 10px; font-weight:700; font-size:11px; margin-bottom:4px }
    .pgrid{ display:grid; grid-template-columns:repeat(8,1fr); gap:1.4mm; align-items:start }
    .pcard{ border:1px solid #999; border-radius:2px; overflow:hidden; display:flex; flex-direction:column; break-inside:avoid }
    .pbar{ font-size:6.5px; font-weight:700; color:#fff; padding:2px 3px; line-height:1.15;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:16px }
    .pcard img{ width:100%; height:60px; object-fit:contain; display:block; background:#fff }
    .pph{ width:100%; height:60px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:6.5px; color:#777; background:#f2f2f2; padding:2px }
    .pqty{ text-align:center; font-weight:700; padding:2px; font-size:8px; border-top:1px solid #ccc }
    .pqty.on{ color:#d80026; font-size:11px }
    .pnote{ margin-top:5px; border:1px solid #999; min-height:20px; padding:3px 8px; font-size:9px }
    .pnote b{ font-size:9px; margin-right:6px }
  }

  /* モーダル（チュートリアル・使い方ガイド） */
  .modal-wrap{ position:fixed; inset:0; background:rgba(15,20,30,.5); z-index:60; display:flex; align-items:center; justify-content:center; padding:16px }
  .modal-wrap.hide{ display:none }
  .modal-card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); width:100%; max-width:620px; max-height:88vh; display:flex; flex-direction:column }
  .modal-head{ padding:14px 18px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:10px }
  .modal-head b{ font-size:15px }
  .modal-x{ background:transparent; border:0; color:var(--ink-soft); font-size:20px; line-height:1; cursor:pointer; padding:0 4px }
  .modal-body{ padding:16px 20px; overflow:auto; font-size:14px; line-height:1.85 }
  .modal-body h4{ margin:16px 0 4px; font-size:13.5px; color:var(--accent-ink); border-left:4px solid var(--accent); padding-left:7px }
  .modal-body h4:first-child{ margin-top:0 }
  .modal-body ul,.modal-body ol{ margin:4px 0; padding-left:22px }
  .modal-body li{ margin:3px 0 }
  .modal-body .lead{ font-size:14px; background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line)); border-radius:10px; padding:10px 12px }
  .modal-foot{ padding:12px 18px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .modal-foot .sp{ margin-left:auto }
  .modal-step{ font-size:12px; font-weight:700; color:var(--ink-soft) }

  /* スポットライト式ツアー */
  #tour{ position:fixed; inset:0; z-index:70 }
  #tour.hide{ display:none }
  #tour.dim{ background:rgba(15,20,30,.55) }
  .tour-hole{ position:fixed; border-radius:10px; outline:3px solid #38bdf8;
    box-shadow:0 0 0 4px rgba(56,189,248,.35), 0 0 0 9999px rgba(15,20,30,.55);
    pointer-events:none; transition:left .15s,top .15s,width .15s,height .15s }
  .tour-tip{ position:fixed; width:320px; max-width:calc(100vw - 24px); background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:14px 16px; font-size:13.5px; line-height:1.8 }
  .tour-tip.center{ left:50% !important; top:50% !important; transform:translate(-50%,-50%); width:440px }
  .tour-tip .big{ background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line)); border-radius:8px; padding:9px 11px }
  .tour-tip .dim2{ color:var(--ink-soft); font-size:12px }
  .tour-step{ font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:5px }
  .tour-btns{ display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap }
  .tour-btns .sp{ margin-left:auto }
</style>

/* ---------- utils ---------- */
const $  = (s,r)=> (r||document).querySelector(s);

const now = ()=> new Date().toISOString();
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n)? n : 0; };
const pad2 = n => String(n).padStart(2,"0");
function todayMonth(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
/* 保存されている UTC の ISO 文字列を、端末のローカル時刻・24時間表記で表示 */
function fmtDT(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d.getTime())) return String(iso).slice(0,16).replace("T"," ");
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())+" "+pad2(d.getHours())+":"+pad2(d.getMinutes());
}
function monthsAgo(n){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-n); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function monthRange(from,to){
  const out=[]; let a=from.split("-").map(Number), b=to.split("-").map(Number), y=a[0], m=a[1], g=0;
  if(!y||!m||!b[0]||!b[1]) return [todayMonth()];
  while((y<b[0] || (y===b[0] && m<=b[1])) && g++<48){ out.push(y+"-"+pad2(m)); m++; if(m>12){m=1;y++;} }
  return out.length?out:[todayMonth()];
}
function debounce(fn,ms){ let t; return function(){ clearTimeout(t); const a=arguments; t=setTimeout(()=>fn.apply(null,a),ms); }; }

function fileToThumb(file,max,q){
  max=max||360; q=q||0.6;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=()=>rej(fr.error||new Error("read error"));
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        const sc=Math.min(1, max/Math.max(w,h||1));
        w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc));
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        try{ res(c.toDataURL("image/jpeg",q)); }catch(e){ rej(e); }
      };
      img.onerror=()=>rej(new Error("画像を読み込めませんでした"));
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function makeStore(){
  const cfg = window.PAMPH_FIREBASE_CONFIG || {};
  const hasFb = cfg && cfg.projectId && cfg.apiKey && typeof window.firebase !== "undefined";
  if(hasFb){
    try{
      firebase.initializeApp(cfg);
      return firebaseStore(firebase.firestore(), cfg.projectId);
    }catch(e){ console.warn("Firebase init 失敗、ローカルモードに切替:", e); }
  }
  return localStore();
}

    watch(coll, cb){
      return fdb.collection(coll).onSnapshot(
        snap=>{ const m={}; snap.forEach(d=> m[d.id]=Object.assign({id:d.id}, d.data())); cb(m); },
        err=>{ console.error(err); showBanner("クラウドに接続できません（"+(err.code||err.message)+"）。Firestore のルールと設定を確認してください。","err"); }
      );
    },
    put(coll,id,data){ return fdb.collection(coll).doc(id).set(data); },
    merge(coll,id,data){ return fdb.collection(coll).doc(id).set(data,{merge:true}); },
    remove(coll,id){ return fdb.collection(coll).doc(id).delete(); }
  };
}
function localStore(){
  const KEY="pamph_v2";
  let mem = load();
  const watchers = {};
  let ch = null;
  try{ ch = new BroadcastChannel(KEY); ch.onmessage = ()=>{ mem = load(); fireAll(); }; }catch(e){}
  window.addEventListener("storage", e=>{ if(e.key===KEY){ mem = load(); fireAll(); } });
  function load(){ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):{}; }catch(e){ return {}; } }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(mem)); }catch(e){ showBanner("この端末に保存できませんでした（容量制限の可能性）。","err"); } if(ch) try{ ch.postMessage(1); }catch(e){} }
  function mapOf(coll){ const c=mem[coll]||{}, out={}; for(const k in c) out[k]=Object.assign({id:k}, c[k]); return out; }
  function fire(coll){ (watchers[coll]||[]).forEach(cb=>{ try{ cb(mapOf(coll)); }catch(e){ console.error(e); } }); }
  function fireAll(){ Object.keys(watchers).forEach(fire); }
  return {
    mode:"local", label:"ローカル demo モード（この端末のみ）",
    watch(coll, cb){ (watchers[coll]=watchers[coll]||[]).push(cb); Promise.resolve().then(()=>cb(mapOf(coll))); return ()=>{ watchers[coll]=(watchers[coll]||[]).filter(x=>x!==cb); }; },
    put(coll,id,data){ (mem[coll]=mem[coll]||{})[id]=Object.assign({},data); delete mem[coll][id].id; save(); fire(coll); return Promise.resolve(); },
    merge(coll,id,data){ const cur=(mem[coll]=mem[coll]||{})[id]||{}; mem[coll][id]=deepMerge(cur,data); delete mem[coll][id].id; save(); fire(coll); return Promise.resolve(); },
    remove(coll,id){ if(mem[coll]) delete mem[coll][id]; save(); fire(coll); return Promise.resolve(); }
  };
}
function deepMerge(a,b){
  const out = Array.isArray(a)? a.slice() : Object.assign({}, a);
  for(const k in b){
    const v=b[k];
    if(v && typeof v==="object" && !Array.isArray(v) && out[k] && typeof out[k]==="object" && !Array.isArray(out[k])) out[k]=deepMerge(out[k],v);
    else out[k]=v;
  }
  return out;
}

  if(sortFixed) return;

function guideTitle(tab){ return tab==="submitted" ? "使い方ガイド（提出済み）" : tab==="history" ? "使い方ガイド（履歴）" : "使い方ガイド（発注）"; }

let tourTab = "order", tourIdx = 0, tourFromGuide = false, tourReturnState = null;
function tourDoneKey(tab){ return "pamph_tut_"+tab+"_v1"; }
function markTourDone(tab){ try{ localStorage.setItem(tourDoneKey(tab||tourTab),"1"); }catch(e){} }
function syncTabButtons(){ $$("#tabs button").forEach(x=> x.setAttribute("aria-selected", x.dataset.tab===UI.tab ? "true":"false")); }
function snapshotUI(){
  return { tab:UI.tab, month:UI.month, storeId:UI.storeId, orderer:UI.orderer,
    draft:Object.assign({},UI.draft), draftNote:UI.draftNote, draftDirty:UI.draftDirty,
    subMonth:UI.subMonth, subOpen:new Set(UI.subOpen), sumMonth:UI.sumMonth,
    poStatusFilter:UI.poStatusFilter, catBrand:UI.catBrand, hist:Object.assign({},UI.hist) };
}
function restoreUI(s){
  if(!s) return;
  UI.tab=s.tab; UI.month=s.month; UI.storeId=s.storeId; UI.orderer=s.orderer;
  UI.draft=s.draft; UI.draftNote=s.draftNote; UI.draftDirty=s.draftDirty;
  UI.subMonth=s.subMonth; UI.subOpen=s.subOpen; UI.sumMonth=s.sumMonth;
  UI.poStatusFilter=s.poStatusFilter; UI.catBrand=s.catBrand; UI.hist=s.hist;
  syncTabButtons(); renderAll();

function resetOrderScreen(){
  UI.tab="order"; UI.storeId=""; UI.draft={}; UI.draftNote=""; UI.draftDirty=false;
  syncTabButtons(); renderAll();
}
function maybeAutoTour(tab){
  if(!TOURS[tab]) return;
  try{ if(location.search.indexOf("shot")>=0) return; }catch(e){}
  let done=false; try{ done = !!localStorage.getItem(tourDoneKey(tab)); }catch(e){ done=true; }
  if(done) return;
  setTimeout(function(){ if(UI.tab===tab && $("#tour").classList.contains("hide") && $("#modal").classList.contains("hide")) startTour(tab, false); }, 450);
}
function startTour(tab, fromGuide){
  tourTab = TOURS[tab] ? tab : "order";
  tourIdx = 0;
  tourFromGuide = !!fromGuide;
  tourReturnState = fromGuide ? snapshotUI() : null;
  closeModal();
  UI.tourPreview = true;
  if(UI.tab !== tourTab){ UI.tab = tourTab; syncTabButtons(); }
  if(tourTab==="order" && !UI.storeId){ UI.draft={}; UI.draftNote=""; UI.draftDirty=false; }
  renderAll();
  window.addEventListener("resize", onTourResize);
  showTourStep();
}
function onTourResize(){ if(!$("#tour").classList.contains("hide")) showTourStep(); }
function closeTourDom(){ const t=$("#tour"); t.className="hide"; t.innerHTML=""; window.removeEventListener("resize", onTourResize); }
function endTour(mode){
  closeTourDom();
  markTourDone(tourTab);
  UI.tourPreview = false;
  if(mode==="replay"){ UI.tourPreview = true; tourIdx = 0; renderAll(); window.addEventListener("resize", onTourResize); showTourStep(); return; }
  if(mode==="back" && tourReturnState){ restoreUI(tourReturnState); tourReturnState = null; return; }
  if(mode==="reset"){ resetOrderScreen(); return; }
  // 既定（はじめる / スキップ / ×）
  if(tourFromGuide && tourReturnState){ restoreUI(tourReturnState); tourReturnState = null; return; }
  if(tourTab==="order"){ resetOrderScreen(); return; }
  renderAll();
}
function showTourStep(){
  const steps = TOURS[tourTab] || [];
  if(tourIdx<0) tourIdx=0;
  if(tourIdx>=steps.length){ endTour(); return; }
  const s = steps[tourIdx];
  let el = s.sel ? document.querySelector(s.sel) : null;
  if(s.sel && !el && tourIdx < steps.length-1){ tourIdx++; return showTourStep(); }
  if(el && el.scrollIntoView){ el.scrollIntoView({block:"center"}); }
  requestAnimationFrame(function(){
    const last = tourIdx === steps.length-1;
    let btns;
    if(last){
      btns = (tourIdx>0 ? '<button class="btn sm" data-act="tour-prev">戻る</button>' : '')+
        (tourFromGuide
          ? '<button class="btn sm primary" data-act="tour-back">直前の画面に戻る</button>'+
            '<button class="btn sm" data-act="tour-reset">最初から始める</button>'+
            '<button class="btn sm" data-act="tour-replay">もう一度チュートリアルを見る</button>'
          : '<button class="btn sm primary sp" data-act="tour-done">はじめる</button>');
    }else{
      btns = '<button class="btn sm" data-act="tour-skip">スキップ</button>'+
        (tourIdx>0 ? '<button class="btn sm" data-act="tour-prev">戻る</button>' : '')+
        '<button class="btn sm primary sp" data-act="tour-next">次へ</button>';
    }
    const nav =
      '<div class="tour-step">'+(tourIdx+1)+' / '+steps.length+'</div>'+
      '<div class="tour-text">'+ s.html +
        (tourIdx===0 ? '<div class="dim2" style="margin-top:8px">💡「次へ」ボタン、または <b>Enter キー</b> で進みます。「戻る」で1つ前に戻れます。</div>' : '') +
      '</div>'+
      '<div class="tour-btns">'+ btns +'</div>';
    const tour = $("#tour");
    let holeHtml="", tipStyle="", centered = !el;
    if(el){
      const r = el.getBoundingClientRect();
      const p = 6;
      const hx = Math.max(4, r.left-p), hy = Math.max(4, r.top-p);
      holeHtml = '<div class="tour-hole" style="left:'+hx+'px;top:'+hy+'px;width:'+(r.width+p*2)+'px;height:'+(r.height+p*2)+'px"></div>';
      const vw = window.innerWidth, vh = window.innerHeight, tw = 320;
      if(vw - r.right > tw + 24) tipStyle = 'left:'+(r.right+16)+'px;top:'+Math.max(12, Math.min(r.top, vh-260))+'px';
      else if(vh - r.bottom > 220) tipStyle = 'left:'+Math.max(12, Math.min(r.left, vw-tw-16))+'px;top:'+(r.bottom+16)+'px';
      else tipStyle = 'left:'+Math.max(12, Math.min(r.left, vw-tw-16))+'px;top:'+Math.max(12, r.bottom-260)+'px';
    }
    tour.className = centered ? "dim" : "";
    tour.innerHTML = holeHtml + '<div class="tour-tip'+(centered?" center":"")+'"'+(centered?"":' style="'+tipStyle+'"')+'>'+nav+'</div>';
  });
}
function onTourClick(e){
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="tour-skip"){ endTour(); }
  else if(a==="tour-done"){ endTour("done"); }
  else if(a==="tour-back"){ endTour("back"); }
  else if(a==="tour-reset"){ endTour("reset"); }
  else if(a==="tour-replay"){ endTour("replay"); }
  else if(a==="tour-next"){ tourIdx++; showTourStep(); }
  else if(a==="tour-prev"){ tourIdx--; showTourStep(); }
}
function openGuide(tab){
  tab = GUIDES[tab] ? tab : "order";
  openModal(guideTitle(tab), GUIDES[tab],
    '<button class="btn primary sm" data-act="tut-start" data-tab="'+tab+'">チュートリアルをはじめる</button>'+
    '<button class="btn sm sp" data-act="modal-close">閉じる</button>');
}
function onModalClick(e){
  if(e.target.id === "modal"){ closeModal(); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="modal-close"){ closeModal(); }
  else if(a==="tut-start"){ startTour(b.dataset.tab || "order", true); }
}

/* ---------- メール通知（Google Apps Script 経由） ---------- */
function notifyCfg(){ return (DB.config.app && DB.config.app.notify) || {}; }
const MAIL_FOOTER = "\n\n----------------------------------------\nこのメールは自動配信です。お急ぎの場合は担当者（岡田）までご連絡ください。";
function sendNotifyTo(toAddr, subject, body){
  const n = notifyCfg();
  if(!n.on || !n.url || !n.token || !toAddr) return false;
  try{
    fetch(n.url, {
      method:"POST", mode:"no-cors", keepalive:true,
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body: JSON.stringify({ token:n.token, to:toAddr, subject:subject, body:(body||"") + MAIL_FOOTER })
    }).catch(function(){});
    return true;
  }catch(e){ return false; }
}
function sendNotify(kind, subject, body){
  const n = notifyCfg();
  sendNotifyTo(kind==="print" ? (n.printTo||"") : (n.submitTo||""), subject, body);
}

function hashStr(s){ let h=5381; for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))|0; } return (h>>>0).toString(16); }
function settingsPassHash(){ return (DB.config.app && DB.config.app.settingsPassHash) || ""; }
function settingsUnlocked(){
  if(!settingsPassHash()) return true;

}

const scheduleSave = debounce(()=>{ flushSave(false); }, 900);
function flushSave(isSubmit, statusOverride, histLabel){
  if(!UI.storeId) return Promise.resolve();
  const id = sheetId(UI.month, UI.storeId);
  const prev = DB.orderSheets[id] || {};
  const data = {
    month:UI.month, storeId:UI.storeId, storeName:(DB.stores[UI.storeId]||{}).name||"",
    orderer:UI.orderer||prev.orderer||"", status: statusOverride || prev.status || "下書き",
    priority: prev.priority||"通常", note:UI.draftNote, lines:UI.draft, updatedAt:now(),
    createdAt: prev.createdAt || now()
  };
  if(isSubmit){
    const hist = (prev.history||[]).slice();
    hist.push({at:now(), label:(histLabel||"提出")+(UI.orderer? "（"+UI.orderer+"）":"")});
    data.history = hist;
  }
  UI.draftDirty = false;
  const ss = $("#saveState"); if(ss){ ss.textContent="保存済み"; ss.className="save-state saved"; }
  return store.put("orderSheets", id, data);
}

function printBarColor(t){ return (t && t.brand==="none") ? "#666" : brandColor(t && t.brand); }
function buildPrintSheets(storeIds, month){
  const byCat = typesByCat();
  const ordered = CATS.reduce((a,c)=> a.concat(byCat[c.key]||[]), []);
  return storeIds.map(sid=>{
    const s = DB.stores[sid] || {};
    const sh = DB.orderSheets[sheetId(month, sid)];
    if(!sh) return "";
    const lines = sh.lines || {};
    const cards = ordered.map(t=>{
      const q = num(lines[t.id]);
      const u = unitOf(t);
      const qtxt = q>0 ? (u==="束" ? q+"束（約"+(q*perBundleOf(t))+"部）" : q+"部") : "—";
      const img = t.coverImage ? '<img src="'+t.coverImage+'" alt="">' : '<div class="pph">'+esc(t.name)+'</div>';
      return '<div class="pcard"><div class="pbar" style="background:'+printBarColor(t)+'">'+esc(t.name)+'</div>'+img+
             '<div class="pqty '+(q>0?"on":"")+'">'+esc(qtxt)+'</div></div>';
    }).join("");
    return '<div class="psheet">'+
      '<div class="phead"><span>'+esc(month)+'分　パンフレット発注</span><span>店舗名：'+esc(s.name||"")+'</span><span>担当者：'+esc(sh.orderer||"")+'</span></div>'+
      '<div class="pgrid">'+cards+'</div>'+
      '<div class="pnote"><b>備考</b>'+esc(sh.note||"")+'</div>'+
      '</div>';
  }).join("");
}
function doPrint(storeIds, month){
  const ids = storeIds.filter(id=> isSubmitted(DB.orderSheets[sheetId(month, id)]));
  if(!ids.length){ showBanner("印刷できる提出データがありません。","err"); return; }
  const pa = document.getElementById("printArea");
  pa.innerHTML = buildPrintSheets(ids, month);
  window.print();
}

function viewHistory(){
  const h = UI.hist;
  const months = monthRange(h.from, h.to).slice(-24);
  const stOpts = ['<option value="">全店舗（合計）</option>'].concat(
    storesSorted().map(s=> '<option value="'+s.id+'" '+(s.id===h.storeId?"selected":"")+'>'+esc(s.name)+'</option>')
  ).join("");
  const tyOpts = ['<option value="">全種類</option>'].concat(
    activeTypes().map(t=> '<option value="'+t.id+'" '+(t.id===h.typeId?"selected":"")+'>'+esc(t.name)+'</option>')
  ).join("");
  const rowTypes = h.typeId ? activeTypes().filter(t=> t.id===h.typeId) : activeTypes();
  function cellRaw(typeId, mon){
    let s=0;
    Object.values(DB.orderSheets).forEach(sh=>{
      if(sh.month!==mon) return;
      if(h.storeId && sh.storeId!==h.storeId) return;
      s += num((sh.lines||{})[typeId]);
    });
    return s;
  }
  const rows = rowTypes.map(t=>{
    const raw = months.map(m=> cellRaw(t.id,m));
    const rowTotal = raw.reduce((a,b)=>a+b,0);
    if(h.hideZero && rowTotal===0) return "";
    const img = t.coverImage? '<img class="mini" src="'+t.coverImage+'" alt="">' : '<span class="mini"></span>';
    const tag = unitOf(t)==="束" ? '<span class="utag">束</span>' : '';
    return '<tr><td class="name-cell">'+img+'<span>'+esc(t.name)+tag+'</span></td>'+
      raw.map(v=> '<td class="num">'+(v||"")+'</td>').join("")+
      '<td class="num"><b>'+rowTotal+'</b></td></tr>';
  }).join("");
  const colCopies = months.map(m=>{ let s=0; rowTypes.forEach(t=> s+=toCopies(t, cellRaw(t.id,m))); return s; });

  const pivot =
    '<div class="tbl-wrap"><table><thead><tr><th>パンフレット種類</th>'+
    months.map(m=> '<th class="num">'+esc(m.slice(2))+'</th>').join("")+'<th class="num">行合計</th></tr></thead>'+
    '<tbody>'+ (rows || '<tr><td colspan="'+(months.length+2)+'" class="muted">データがありません</td></tr>') +'</tbody>'+
    '<tfoot><tr><td>月合計（部換算）</td>'+colCopies.map(v=>'<td class="num">'+v+'</td>').join("")+
    '<td class="num">'+colCopies.reduce((a,b)=>a+b,0)+'</td></tr></tfoot></table></div>'+
    '<div class="muted" style="margin-top:6px">※ セル・行合計は各種類の単位（束 or 部）そのまま。月合計・総合計のみ部換算（束数×目安部数）。</div>';

  const dsOpts = storesSorted().map(s=> '<option value="'+s.id+'" '+(s.id===h.sheetStore?"selected":"")+'>'+esc(s.name)+'</option>').join("");
  const dsh = h.sheetStore ? DB.orderSheets[sheetId(h.sheetMonth, h.sheetStore)] : null;
  let detail = '<p class="muted">月と店舗を選ぶと、その回の提出内容を表示します。</p>';
  if(h.sheetStore){
    if(!dsh) detail = '<p class="muted">'+esc(h.sheetMonth)+'／'+esc((DB.stores[h.sheetStore]||{}).name||"")+' の発注は記録されていません。</p>';

      const lines = Object.entries(dsh.lines||{}).filter(([,v])=>num(v)>0)
        .map(([tid,v])=>{ const t=DB.pamphletTypes[tid]||{}; return {name:t.name||tid, v:num(v), u:unitOf(t), c:toCopies(t,v)}; })
        .sort((a,b)=> b.c-a.c);
      detail =
        '<div class="muted" style="margin-bottom:6px">状態：<span class="pill" style="background:'+statusColor(dsh.status)+'">'+esc(dsh.status||"")+'</span> ／ 担当：'+esc(dsh.orderer||"—")+' ／ 更新：'+esc(fmtDT(dsh.updatedAt))+'</div>'+
        '<div class="tbl-wrap"><table><thead><tr><th>種類</th><th class="num">発注数</th><th class="num">部換算</th></tr></thead><tbody>'+
        (lines.length? lines.map(l=> '<tr><td>'+esc(l.name)+'</td><td class="num">'+l.v+' '+l.u+'</td><td class="num">'+l.c+'</td></tr>').join("")

        '</tbody></table></div>'+
        (dsh.note? '<div class="hist-note" style="margin-top:8px">備考：'+esc(dsh.note)+'</div>':'');
    }
  }

  return '<section class="panel">'+
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">'+
      '<div><h2>過去の発注数</h2><div class="sub">種類ごと・月ごとの発注数の推移を確認できます。</div></div>'+
      '<button class="btn" data-act="open-guide">📖 使い方ガイド</button>'+
    '</div>'+
    '<div class="row">'+
      '<div class="fld"><label>期間（開始）</label><input type="month" data-act="hfrom" value="'+esc(h.from)+'"></div>'+

      '</div>'+ detail +

}

/* ---------- events ---------- */
function onInput(e){
  const a = e.target.dataset.act;
  if(a==="orderer"){ UI.orderer = e.target.value; }
  if(a==="note"){ UI.draftNote = e.target.value; markDirty(); }
}
async function onChange(e){
  const t = e.target, a = t.dataset.act, id = t.dataset.id, idx = t.dataset.idx;
  if(!a) return;

  /* 発注 */
  if(a==="month"){ if(UI.draftDirty) await flushSave(false); loadDraftFor(t.value, UI.storeId); renderAll(); return; }
  if(a==="store"){ if(UI.draftDirty) await flushSave(false); UI.storeId=t.value; savePrefs(); loadDraftFor(UI.month, UI.storeId); renderAll(); return; }
  if(a==="orderer"){ UI.orderer=t.value.trim(); savePrefs(); return; }
  if(a==="qty"){
    UI.draft[id] = num(t.value);
    t.classList.toggle("qset", num(t.value)>0);
    const card = t.closest(".card"); if(card) card.classList.toggle("has-qty", num(t.value)>0);
    markDirty(); return;
  }
  if(a==="note"){ UI.draftNote=t.value; markDirty(); return; }

  /* 履歴 */
  if(a==="hfrom"){ UI.hist.from=t.value; renderAll(); return; }
  if(a==="hto"){ UI.hist.to=t.value; renderAll(); return; }
  if(a==="hstore"){ UI.hist.storeId=t.value; renderAll(); return; }
  if(a==="htype"){ UI.hist.typeId=t.value; renderAll(); return; }
  if(a==="hzero"){ UI.hist.hideZero=t.checked; renderAll(); return; }
  if(a==="dmonth"){ UI.hist.sheetMonth=t.value; renderAll(); return; }
  if(a==="dstore"){ UI.hist.sheetStore=t.value; renderAll(); return; }

  /* 提出済み */
  if(a==="sub-month"){ UI.subMonth=t.value; renderAll(); return; }

  /* 集計・印刷発注 */
  if(a==="summonth"){ UI.sumMonth=t.value; renderAll(); return; }
  if(a==="pofilter"){ UI.poStatusFilter=t.value; renderAll(); return; }
  if(a==="po-qty"){ await store.merge("printOrders", id, {qty:num(t.value), updatedAt:now()}); return; }
  if(a==="po-note"){ await store.merge("printOrders", id, {note:t.value, updatedAt:now()}); return; }
  if(a==="po-status"){ await store.merge("printOrders", id, {status:t.value, updatedAt:now()}); renderAll(); return; }
  if(a==="po-due"){ await store.merge("printOrders", id, {dueDate:t.value, updatedAt:now()}); return; }

  /* カタログ */
  if(a==="c-title"){ await store.merge("catalogs", id, {title:t.value, updatedAt:now()}); return; }
  if(a==="c-url"){ await store.merge("catalogs", id, {url:t.value.trim(), updatedAt:now()}); return; }
  if(a==="c-active"){ await store.merge("catalogs", id, {active:t.checked, updatedAt:now()}); renderAll(); return; }
  if(a==="c-img"){
    const f=t.files&&t.files[0]; if(!f) return;
    try{ const d=await fileToThumb(f); await store.merge("catalogs", id, {coverImage:d, updatedAt:now()}); renderAll(); }
    catch(err){ showBanner("画像の処理に失敗しました："+err.message,"err"); }
    return;
  }

  /* 設定：店舗 */
  if(a==="s-name"){ await store.merge("stores", id, {name:t.value}); return; }
  if(a==="s-email"){ await store.merge("stores", id, {email:t.value.trim()}); return; }
  if(a==="s-active"){ await store.merge("stores", id, {active:t.checked}); return; }

  /* 設定：種類 */
  if(a==="t-name"){ await store.merge("pamphletTypes", id, {name:t.value, updatedAt:now()}); return; }
  if(a==="t-cat"){ await store.merge("pamphletTypes", id, {category:t.value, updatedAt:now()}); return; }
  if(a==="t-unit"){ await store.merge("pamphletTypes", id, {unit:t.value, perBundle: (DB.pamphletTypes[id]||{}).perBundle || 40, updatedAt:now()}); renderAll(); return; }
  if(a==="t-perbundle"){ await store.merge("pamphletTypes", id, {perBundle:Math.max(1,num(t.value)), updatedAt:now()}); return; }
  if(a==="t-active"){ await store.merge("pamphletTypes", id, {active:t.checked, updatedAt:now()}); return; }
  if(a==="t-new"){ await store.merge("pamphletTypes", id, {isNew:t.checked, updatedAt:now()}); renderAll(); return; }
  if(a==="an-text"){ await store.merge("announcements", id, {text:t.value, updatedAt:now()}); return; }
  if(a==="an-from"){ await store.merge("announcements", id, {from:t.value, updatedAt:now()}); renderAll(); return; }
  if(a==="an-to"){ await store.merge("announcements", id, {to:t.value, updatedAt:now()}); renderAll(); return; }
  if(a==="n-on"){ await store.merge("config","app",{notify:{on:t.checked}, updatedAt:now()}); renderAll(); return; }
  if(a==="n-url"){ await store.merge("config","app",{notify:{url:t.value.trim()}, updatedAt:now()}); return; }
  if(a==="n-token"){ await store.merge("config","app",{notify:{token:t.value.trim()}, updatedAt:now()}); return; }
  if(a==="n-submitto"){ await store.merge("config","app",{notify:{submitTo:t.value.trim()}, updatedAt:now()}); return; }
  if(a==="n-printto"){ await store.merge("config","app",{notify:{printTo:t.value.trim()}, updatedAt:now()}); return; }
  if(a==="n-feedbackto"){ await store.merge("config","app",{notify:{feedbackTo:t.value.trim()}, updatedAt:now()}); return; }
  if(a==="t-img"){
    const f=t.files&&t.files[0]; if(!f) return;
    try{ const d=await fileToThumb(f); await store.merge("pamphletTypes", id, {coverImage:d, updatedAt:now()}); renderAll(); }
    catch(err){ showBanner("画像の処理に失敗しました："+err.message,"err"); }
    return;
  }

  /* 設定：ステータス */
  if(a==="st-name"||a==="st-color"){
    const list = cfg().statuses.map(x=>Object.assign({},x));
    if(a==="st-name") list[idx].name=t.value; else list[idx].color=t.value;
    await store.merge("config","app",{statuses:list, updatedAt:now()}); return;
  }

  /* 設定：インポート */
  if(a==="import"){
    const f=t.files&&t.files[0]; if(!f) return;
    if(!confirm("現在のデータに、読み込んだ内容を上書きします。よろしいですか？")) return;
    try{
      const obj = JSON.parse(await f.text());
      for(const coll of DUMP_COLLS){ const mp=obj[coll]||{}; for(const k in mp) await store.put(coll, k, mp[k]); }
      showBanner("インポートしました。","info");
    }catch(err){ showBanner("インポートに失敗しました："+err.message,"err"); }
    return;
  }
}
async function onClick(e){
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id, idx = b.dataset.idx;

  /* 発注 */
  if(a==="open-guide"){ openGuide(UI.tab); return; }
  if(a==="fb-send"){
    const st = ($("#fb-store")||{}).value||"";
    const nm = (($("#fb-name")||{}).value||"").trim();
    const gn = ($("#fb-genre")||{}).value||"";
    const bd = (($("#fb-body")||{}).value||"").trim();
    if(!bd){ showBanner("ご意見の内容を入力してください。","err"); return; }
    const rec = { store:st, name:nm, genre:gn, text:bd, createdAt:now() };
    await store.put("feedback", uid(), rec);
    const n = notifyCfg();
    const sent = sendNotifyTo(n.feedbackTo || n.submitTo || "",
      "【意見箱】"+(gn||"")+"（"+(st||"店舗未選択")+"）",
      "店舗："+(st||"（未選択）")+"\n氏名："+(nm||"（未記入）")+"\nジャンル："+(gn||"")+"\n日時："+fmtDT(rec.createdAt)+"\n\n"+bd+"\n\nアプリ：https://inoue-group.github.io/pamphlet/");
    if(UI.orderer!==nm && nm){ UI.orderer = nm; savePrefs(); }
    showBanner("送信しました。ご意見ありがとうございます。"+(sent?"":"（メール通知が未設定のため記録のみ保存しました）"),"info");
    renderAll(); return;
  }
  if(a==="save"){ await flushSave(false); renderAll(); return; }
  if(a==="submit-none"){
    if(!UI.storeId){ showBanner("店舗を選択してください。","err"); return; }
    if(!confirm(UI.month+"／"+(DB.stores[UI.storeId]||{}).name+" を「発注なし」として提出します。よろしいですか？")) return;
    await flushSave(true, "発注なし", "発注なし ");
    var nm0 = (DB.stores[UI.storeId]||{}).name||"";
    sendNotify("submit", "【発注なし】"+nm0+" "+UI.month, nm0+" は "+UI.month+" 分を「発注なし」で提出しました。\n担当："+(UI.orderer||"—")+"\n\nアプリ：https://inoue-group.github.io/pamphlet/");
    showBanner(nm0+" を発注なしで提出しました。","info");
    renderAll(); return;
  }
  if(a==="submit"){
    if(!UI.storeId){ showBanner("店舗を選択してください。","err"); return; }
    await flushSave(true, "提出済", "提出 ");
    var nm1 = (DB.stores[UI.storeId]||{}).name||"";
    var sh1 = DB.orderSheets[sheetId(UI.month, UI.storeId)] || {};
    var cnt1 = Object.values(UI.draft).filter(function(v){ return num(v)>0; }).length;
    sendNotify("submit", "【提出】"+nm1+" "+UI.month+"（"+cnt1+"品目）", nm1+" が "+UI.month+" 分の発注を提出しました。\n担当："+(UI.orderer||"—")+" ／ 品目数："+cnt1+"\n備考："+(UI.draftNote||"（なし）")+"\n\n提出済みタブで確認：https://inoue-group.github.io/pamphlet/");
    showBanner(UI.month+"／"+nm1+" の発注を提出しました。","info");
    renderAll(); return;
  }

  /* 提出済み */
  if(a==="sub-toggle"){ if(UI.subOpen.has(id)) UI.subOpen.delete(id); else UI.subOpen.add(id); renderAll(); return; }
  if(a==="sub-print"){ doPrint([id], UI.subMonth); return; }
  if(a==="sub-printall"){ doPrint(activeStores().map(s=>s.id), UI.subMonth); return; }
  if(a==="sub-confirm"){ await store.merge("orderSheets", sheetId(UI.subMonth, id), {confirmedAt: now()}); renderAll(); return; }
  if(a==="sub-unconfirm"){ await store.merge("orderSheets", sheetId(UI.subMonth, id), {confirmedAt: ""}); renderAll(); return; }
  if(a==="sub-ready"){
    const sid = sheetId(UI.subMonth, id);
    if(!DB.orderSheets[sid]) return;
    await store.merge("orderSheets", sid, {readyAt: now()});
    const st = DB.stores[id]||{};
    const sent = sendNotifyTo(st.email||"",
      "【準備完了】"+(st.name||"")+" "+UI.subMonth+" 分パンフレット",
      (st.name||"")+" "+UI.subMonth+" 分のパンフレットの準備ができました。\n受け取り、または受け取りされる方への手配をお願いします。\n\nアプリ：https://inoue-group.github.io/pamphlet/");
    showBanner((st.name||"")+" を「準備済」にしました。"+(sent?"（店舗へ通知メールを送信）":"（この店舗のメール未登録のため通知は送っていません）"),"info");
    renderAll(); return;
  }
  if(a==="sub-unready"){ await store.merge("orderSheets", sheetId(UI.subMonth, id), {readyAt: ""}); renderAll(); return; }
  if(a==="po-confirm"){ await store.merge("printOrders", id, {confirmedAt: now()}); renderAll(); return; }
  if(a==="po-unconfirm"){ await store.merge("printOrders", id, {confirmedAt: ""}); renderAll(); return; }
  if(a==="sub-unsubmit"){
    const sid = sheetId(UI.subMonth, id);
    const sh = DB.orderSheets[sid]; if(!sh) return;
    if(!confirm((DB.stores[id]||{}).name+" の提出を取り消して下書きに戻します。よろしいですか？")) return;
    const hist = (sh.history||[]).slice(); hist.push({at:now(), label:"提出取消"});
    await store.merge("orderSheets", sid, {status:"下書き", history:hist, updatedAt:now()});
    renderAll(); return;
  }

  /* 集計 → 印刷発注へ登録（部数） */
  if(a==="po-add"){
    const t = DB.pamphletTypes[id]||{};
    const inp = document.getElementById("rq-"+id);
    const qty = num(inp && inp.value);
    await store.put("printOrders", uid(), {
      typeId:id, typeName:t.name||"", qty:qty, actualCopies:0, note:"", dueDate:"",
      status:"依頼中", month:UI.sumMonth, createdAt:now(), updatedAt:now()
    });
    sendNotify("print", "【印刷発注 新規】"+(t.name||"")+" "+qty+"部", (t.name||"")+" を "+qty+" 部、印刷発注に登録しました（対象月 "+UI.sumMonth+"）。\n\n印刷発注タブで確認：https://inoue-group.github.io/pamphlet/");
    UI.tab = "print";
    $$("#tabs button").forEach(x=> x.setAttribute("aria-selected", x.dataset.tab==="print" ? "true":"false"));
    showBanner("印刷発注に登録しました（"+esc(t.name||"")+" "+qty+" 部）。","info"); renderAll(); return;
  }
  if(a==="po-addmanual"){
    const sel = $('[data-act="po-newtype"]');
    const q = document.getElementById("po-newqty");
    const mo = document.getElementById("po-newmonth");
    const tid = sel && sel.value; if(!tid){ showBanner("種類を選択してください。","err"); return; }
    const t = DB.pamphletTypes[tid]||{};
    const mqty = num(q && q.value);
    const mmonth = (mo && mo.value) || UI.sumMonth;
    await store.put("printOrders", uid(), {
      typeId:tid, typeName:t.name||"", qty:mqty, actualCopies:0, note:"", dueDate:"",
      status:"依頼中", month:mmonth, createdAt:now(), updatedAt:now()
    });
    sendNotify("print", "【印刷発注 新規】"+(t.name||"")+" "+mqty+"部", (t.name||"")+" を "+mqty+" 部、印刷発注に登録しました（対象月 "+mmonth+"）。\n\n印刷発注タブで確認：https://inoue-group.github.io/pamphlet/");
    renderAll(); return;
  }
  if(a==="po-del"){ if(confirm("この印刷発注を削除しますか？")){ await store.remove("printOrders", id); renderAll(); } return; }

  /* カタログ */
  if(a==="c-add"){ const n=catalogsSorted().length; await store.put("catalogs", uid(), {title:"新規カタログ", url:"", coverImage:"", brand:"sai", sortOrder:(n+1)*10, active:true, updatedAt:now()}); renderAll(); return; }
  if(a==="c-del"){ if(confirm("このカタログを削除しますか？")){ await store.remove("catalogs", id); renderAll(); } return; }
  if(a==="c-brand"){ await store.merge("catalogs", id, {brand:b.dataset.brand, updatedAt:now()}); renderAll(); return; }
  if(a==="t-brand"){ await store.merge("pamphletTypes", id, {brand:b.dataset.brand, updatedAt:now()}); renderAll(); return; }
  if(a==="c-img-clr"){ await store.merge("catalogs", id, {coverImage:"", updatedAt:now()}); renderAll(); return; }
  if(a==="c-up"||a==="c-down"){ await reorder("catalogs", catalogsSorted(), id, a==="c-up"?-1:1); renderAll(); return; }
  if(a==="c-brandfilter"){ UI.catBrand = b.dataset.brand; renderAll(); return; }
  if(a==="c-copy"){
    const url = b.dataset.url||"";
    try{ await navigator.clipboard.writeText(url); showBanner("URL をコピーしました：" + url, "info"); }
    catch(err){ window.prompt("この URL をコピーしてください", url); }
    return;
  }

  /* 設定：お知らせ */
  if(a==="an-add"){ await store.put("announcements", uid(), {text:"", from:"", to:"", active:true, createdAt:now(), updatedAt:now()}); renderAll(); return; }
  if(a==="an-del"){ if(confirm("このお知らせを削除しますか？")){ await store.remove("announcements", id); renderAll(); } return; }

  /* 設定タブのパスワード */
  if(a==="settings-unlock"){
    const v = (document.getElementById("set-pw")||{}).value||"";
    if(hashStr(v) === settingsPassHash()){
      try{ sessionStorage.setItem("pamph_set_ok", settingsPassHash()); }catch(e){}
      showBanner("設定タブを解除しました。","info"); renderAll();
    }else{ showBanner("パスワードが違います。","err"); }
    return;
  }
  if(a==="settings-setpw"){
    const v = (document.getElementById("set-newpw")||{}).value||"";
    if(v.length<3){ showBanner("パスワードは3文字以上で設定してください。","err"); return; }
    const h = hashStr(v);
    await store.merge("config","app",{settingsPassHash:h, updatedAt:now()});
    try{ sessionStorage.setItem("pamph_set_ok", h); }catch(e){}
    showBanner("設定タブのパスワードを保存しました。","info"); renderAll(); return;
  }
  if(a==="settings-clearpw"){
    if(!confirm("設定タブのパスワードを解除しますか？（誰でも設定タブを開けるようになります）")) return;
    await store.merge("config","app",{settingsPassHash:"", updatedAt:now()});
    showBanner("設定タブのパスワードを解除しました。","info"); renderAll(); return;
  }

  /* 設定：メール通知テスト */
  if(a==="n-test"){
    const n = notifyCfg();
    if(!n.url || !n.token){ showBanner("Apps Script の URL と合言葉を入力してください。","err"); return; }
    if(!n.submitTo){ showBanner("「提出の通知先」を入力してください。","err"); return; }
    try{
      await fetch(n.url, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({token:n.token, to:n.submitTo, subject:"【テスト】パンフレット発注管理 メール通知",
          body:"これはテストメールです。届いていれば設定は正常です。\n\n"+new Date().toLocaleString()+MAIL_FOOTER})});
      showBanner("テスト送信しました（"+n.submitTo+"）。数分待っても届かない場合は Apps Script の設定を確認してください。","info");
    }catch(e){ showBanner("送信に失敗しました："+e.message,"err"); }
    return;
  }

  /* 設定：店舗 */
  if(a==="s-add"){ const n=storesSorted().length; await store.put("stores", uid(), {name:"新規店舗", sortOrder:(n+1)*10, active:true}); renderAll(); return; }
  if(a==="s-del"){ if(confirm("この店舗を削除しますか？（過去の発注記録は残ります）")){ await store.remove("stores", id); renderAll(); } return; }
  if(a==="s-up"||a==="s-down"){ await reorder("stores", storesSorted(), id, a==="s-up"?-1:1); renderAll(); return; }

  /* 設定：種類 */
  if(a==="t-add"){
    const n=typesSorted().length;
    await store.put("pamphletTypes", uid(), {name:"新規パンフレット", category:"pamphlet", coverImage:"", note:"", unit:"束", perBundle:40, brand:"sai", isNew:true, sortOrder:(n+1)*10, active:true, updatedAt:now()});
    renderAll(); return;
  }
  if(a==="t-del"){ if(confirm("この種類を削除しますか？（過去の発注記録は残ります）")){ await store.remove("pamphletTypes", id); renderAll(); } return; }
  if(a==="t-img-clr"){ await store.merge("pamphletTypes", id, {coverImage:"", updatedAt:now()}); renderAll(); return; }
  if(a==="t-up"||a==="t-down"){ await reorder("pamphletTypes", typesSorted(), id, a==="t-up"?-1:1); renderAll(); return; }

  /* 設定：ステータス／選択肢／バックアップ */
  if(a==="st-add"){ const list=cfg().statuses.concat({name:"新規",color:"#6b7280"}); await store.merge("config","app",{statuses:list, updatedAt:now()}); renderAll(); return; }
  if(a==="st-del"){ const list=cfg().statuses.filter((_,i)=>i!=idx); await store.merge("config","app",{statuses:list, updatedAt:now()}); renderAll(); return; }
  if(a==="opts-save"){
    const parse = s => Array.from(new Set(String(s).split(/[,\s]+/).map(x=>parseInt(x,10)).filter(x=>Number.isFinite(x)&&x>=0))).sort((x,y)=>x-y);
    const qa = parse($('[data-act="qty-opts"]').value), ba = parse($('[data-act="bundle-opts"]').value);
    if(!qa.length || !ba.length){ showBanner("それぞれ数値を1つ以上入力してください。","err"); return; }
    await store.merge("config","app",{qtyOptions:qa, bundleOptions:ba, updatedAt:now()});
    showBanner("保存しました。","info"); renderAll(); return;
  }
  if(a==="demo-reset"){
    if(confirm("demo データを消して初期状態に戻します。よろしいですか？")){
      try{ localStorage.removeItem("pamph_v2"); }catch(e){}
      location.reload();
    }
    return;
  }
  if(a==="export"){
    const dump={}; DUMP_COLLS.forEach(cc=> dump[cc]=DB[cc]);
    const blob = new Blob([JSON.stringify(dump,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob); const link=document.createElement("a");
    link.href=url; link.download="パンフレット発注_バックアップ_"+todayISO()+".json"; link.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000); return;
  }
}
async function reorder(coll, list, id, dir){
  const arr = list.slice();
  const i = arr.findIndex(x=>x.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=arr.length) return;
  arr.splice(j, 0, arr.splice(i, 1)[0]);        // move the item one step
  for(let k=0; k<arr.length; k++){               // renumber sequentially (fixes gaps/duplicates)
    const want = (k+1)*10;
    if((arr[k].sortOrder||0) !== want) await store.merge(coll, arr[k].id, {sortOrder:want});
  }
}

let autoPicked = false;
function maybeAutoPick(){
  if(autoPicked) return;
  let on = false; try{ on = new URLSearchParams(location.search).has("shot"); }catch(e){}
  if(!on){ autoPicked = true; return; }
  const st = activeStores();
  if(!st.length) return;
  autoPicked = true;
  if(!UI.storeId) UI.storeId = st[0].id;
  if(!UI.orderer) UI.orderer = "鈴木";
  loadDraftFor(UI.month, UI.storeId);
}

/* ---------- go ---------- */
function start(){
  boot(); loadDraftFor(UI.month, UI.storeId); renderAll();
  try{
    const forced = new URLSearchParams(location.search).get("tour");
    if(forced && TOURS[forced]){ setTimeout(function(){ startTour(forced); }, 500); return; }
  }catch(e){}
  maybeAutoTour(UI.tab);
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", start);
else start();

})();
</script>
